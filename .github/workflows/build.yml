name: Build agent

# The DPC agent had no CI: every APK was built on someone's machine and carried to
# the server by hand. This builds each push, and publishes to the MDM server when
# the signing key and an admin API key are configured as secrets.
#
# Secrets, all optional — without them the job still builds and uploads an unsigned
# artifact, it just cannot publish:
#   KEYSTORE_BASE64  base64 of the release keystore (keystore/aio-mdm-dpc.jks)
#   KEYSTORE_PASS / KEY_ALIAS / KEY_PASS
#   MDM_SERVER_URL / MDM_ADMIN_API_KEY   where to publish a build from the default branch

on:
  push:
    branches: [menu-board, main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the MDM server after building
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The secrets context can't be read in an `if:`, so turn "is it configured?"
      # into step outputs first and branch on those.
      - name: What is configured
        id: have
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          MDM_ADMIN_API_KEY: ${{ secrets.MDM_ADMIN_API_KEY }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] && echo "keystore=yes" >> "$GITHUB_OUTPUT" || echo "keystore=no" >> "$GITHUB_OUTPUT"
          [ -n "$MDM_ADMIN_API_KEY" ] && echo "publish=yes" >> "$GITHUB_OUTPUT" || echo "publish=no" >> "$GITHUB_OUTPUT"

      - name: Restore the signing keystore
        id: signing
        if: steps.have.outputs.keystore == 'yes'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "keystore=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Report what was built
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: aio-mdm-dpc-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Publishing replaces the agent APK the server hosts, so it is deliberate: the
      # default branch or a manual run that asked for it, never a PR, and only when
      # the build was actually signed (an unsigned agent installs nowhere).
      - name: Publish to the MDM server
        if: >-
          steps.have.outputs.publish == 'yes' &&
          steps.have.outputs.keystore == 'yes' &&
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/menu-board' || inputs.publish)
        env:
          SERVER: ${{ secrets.MDM_SERVER_URL }}
          KEY: ${{ secrets.MDM_ADMIN_API_KEY }}
        run: |
          curl -fsS -X POST "${SERVER%/}/api/v1/agent-apk?name=aio-mdm-dpc.apk" \
            -H "X-API-Key: $KEY" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @app/build/outputs/apk/release/app-release.apk
